<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1519" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="TIDELOCK — a narrative action-adventure set in the flooded borough of Morrow Quay."
    />
    <title>TIDELOCK</title>
    <link rel="icon" type="image/svg+xml" href="pwa/favicon.svg" />
    <link rel="apple-touch-icon" href="pwa/apple-touch-icon.png" />
  </head>
  <body>
    <!--
      #app hosts UI layers. The WebGL/WebGPU canvas is created by the renderer
      and inserted into #viewport so the UI can layer above it predictably.
    -->
    <div id="app">
      <div id="viewport" aria-hidden="true"></div>
      <div id="ui-root"></div>
      <noscript>
        <div class="noscript-notice">
          TIDELOCK requires JavaScript and a WebGL2-capable browser.
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
